# En la nube se define SPRING_PROFILES_ACTIVE=prod (no existe application-prod: usa solo este archivo)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.application.name=sportify-backend

# Configuraci\u00f3n de la conexi\u00f3n a la base de datos PostgreSQL
# En Neon se puede pegar en DB_URL la cadena "Java" completa (ya incluye usuario y clave);
# en ese caso DB_USERNAME y DB_PASSWORD pueden quedar vacíos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportify_bd}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Configuraci\u00f3n de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto: Render lo asigna en la variable PORT; en local sigue siendo 8080
server.port=${PORT:8080}
# Render pone un proxy HTTPS delante: Spring debe confiar en sus cabeceras X-Forwarded-*
server.forward-headers-strategy=framework

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
