name: CI Sportify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportify_bd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend/sportify-backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Correr pruebas Backend (JUnit)
      run: mvn clean test
      env:
        DB_URL: jdbc:postgresql://localhost:5432/sportify_bd
        DB_USERNAME: postgres
        DB_PASSWORD: postgres

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Instalar dependencias
      run: npm ci
      
    - name: Auditoría de seguridad
      run: npm audit --audit-level=high || true 
      
    - name: Correr pruebas de Frontend
      run: node --test tests/ui.test.mjs
      
    - name: Compilar Frontend
      run: npm run build